version: 2
updates:
  - package-ecosystem: 'gradle'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    assignees:
      - 'rymsha'
    reviewers:
      - 'rymsha'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Keep in sync with minimumReleaseAge and minimumReleaseAgeExclude in pnpm-workspace.yaml,
    # so Dependabot never proposes a version pnpm refuses to install.
    cooldown:
      default-days: 3
      exclude:
        - '@enonic/ui'
        - '@enonic-types/*'
        - '@typescript/native-preview*'
    open-pull-requests-limit: 10
    assignees:
      - 'edloidas'
    reviewers:
      - 'edloidas'
    # The first matching group wins, so the catch-all groups go last.
    groups:
      enonic:
        patterns:
          - '@enonic/*'
          - '@enonic-types/*'
      # Dependabot does not bump the `vite` catalog alias (npm:@voidzero-dev/vite-plus-core@...),
      # whose version differs from vite-plus. When vite-plus moves, set the alias to the
      # vite-plus-core version `npm view vite-plus@<version> dependencies` lists, or run `vp migrate`.
      vite-plus:
        patterns:
          - 'vite-plus'
          - 'vite'
          - '@voidzero-dev/*'
          - 'vitest'
          - '@vitest/*'
      storybook:
        patterns:
          - 'storybook'
          - '@storybook/*'
      i18next:
        patterns:
          - 'i18next'
          - 'i18next-*'
          - 'react-i18next'
      tailwindcss:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
          - 'tw-animate-css'
      preact:
        patterns:
          - 'preact'
          - '@preact/*'
      react-types:
        patterns:
          - '@types/react'
          - '@types/react-dom'
      typescript:
        patterns:
          - 'typescript'
          - '@typescript/*'
      nanostores:
        patterns:
          - 'nanostores'
          - '@nanostores/*'
      lodash:
        patterns:
          - 'lodash.*'
          - '@types/lodash.*'
      slate:
        patterns:
          - 'slate'
          - 'slate-*'
      dependencies:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      majors:
        patterns:
          - '*'
        update-types:
          - 'major'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    assignees:
      - 'rymsha'
    reviewers:
      - 'rymsha'
    groups:
      actions:
        patterns:
          - '*'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'
